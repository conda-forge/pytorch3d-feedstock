github:
  branch_name: main
  tooling_branch_name: main
conda_build:
  error_overlinking: true
conda_build_tool: rattler-build
conda_install_tool: pixi
conda_forge_output_validation: true
# conda-forge-ci-setup >=4.30 exports CONDA_OVERRIDE_CUDA_ARCH, needed to install
# libcudnn (via cuda-arch) on GPU-less runners; pixi otherwise resolves an older one.
remote_ci_setup:
  - conda-forge-ci-setup>=4.30,<5
  - conda-build>=26.3
provider:
  linux_aarch64: default
  osx_arm64: default
test: native_and_emulated
workflow_settings:
  build_workspace_dir:
    - os: win
      provider: azure
      value: C:\\bld\\
  free_disk_space: max
